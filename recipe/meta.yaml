{% set name = "bilby_tgr" %}
{% set version = "0.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/bilby_tgr-{{ version }}.tar.gz
  sha256: a4bd144533ae7cc59962d8c29f5e6fa9fe7001621aa16557daea27c33acd327b
  patches:
    # replace the dependency lalsuite by the actually required subcomponents python-lal
    # and python-lalsimulation, which are not packaged separately on PyPI
    - 0001-minimise-dependencies.patch

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - setuptools-scm >=3.4.3
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - bilby
    - python-lal >=7.4.0
    - python-lalsimulation >=5.3.0
    - numpy >=1.17

test:
  imports:
    - bilby_tgr
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://git.ligo.org/lscsoft/bilby_tgr
  summary: Testing GR analysis pipelines to use with Bilby
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - adivijaykumar
    - jsteinhoff
    - magathos
